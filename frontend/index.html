<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline-first dairy delivery management, billing & ledger app." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Dairy Manager</title>

    <style>
      /* ── Splash Screen ───────────────────────────── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #FFF8F0; /* --color-surface cream */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #splash-milk {
        position: absolute;
        inset: 0;
        background: #FFF8F0;
        clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%);
        animation: milkPour 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes milkPour {
        0%   { clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%); }
        15%  { clip-path: polygon(85% 100%, 100% 100%, 100% 85%, 95% 90%); }
        35%  { clip-path: polygon(60% 100%, 100% 100%, 100% 55%, 70% 65%, 50% 75%); }
        55%  { clip-path: polygon(25% 100%, 100% 100%, 100% 25%, 60% 35%, 30% 50%, 15% 70%); }
        75%  { clip-path: polygon(0% 100%, 100% 100%, 100% 8%, 70% 12%, 40% 18%, 10% 25%, 0% 40%); }
        90%  { clip-path: polygon(0% 100%, 100% 100%, 100% 0%, 70% 2%, 40% 5%, 10% 3%, 0% 8%); }
        100% { clip-path: polygon(0% 100%, 100% 100%, 100% 0%, 0% 0%); }
      }

      #splash-brand {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0;
        transform: scale(0.9);
        animation: brandReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
      }

      .splash-icon {
        font-size: 3.5rem;
        filter: drop-shadow(0 4px 8px rgba(107, 58, 31, 0.15));
      }

      .splash-title {
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        color: #6B3A1F; /* --color-brand-600 cocoa */
        letter-spacing: -0.02em;
      }

      @keyframes brandReveal {
        from { opacity: 0; transform: scale(0.9); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* Fade out entire splash */
      #splash.fade-out {
        animation: splashFadeOut 0.5s ease-out forwards;
      }

      @keyframes splashFadeOut {
        from { opacity: 1; }
        to   { opacity: 0; pointer-events: none; }
      }

      /* Accessibility: skip splash for reduced-motion users */
      @media (prefers-reduced-motion: reduce) {
        #splash { display: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Milk Pour Splash Screen (session-gated) -->
    <div id="splash" aria-hidden="true">
      <div id="splash-milk"></div>
      <div id="splash-brand">
        <span class="splash-icon">🥛</span>
        <span class="splash-title">Dairy Manager</span>
      </div>
    </div>

    <script>
      // Skip splash on repeat visits within same session
      if (sessionStorage.getItem('splash_shown')) {
        document.getElementById('splash').remove();
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
